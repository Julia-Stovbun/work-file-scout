name: Build and publish Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --windowed --name WorkScout scout.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorkScout-Windows
          path: dist/WorkScout.exe
      - name: Publish public release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.1.0 dist/WorkScout.exe --title "Work Scout v0.1.0" --notes "First Windows preview. Read-only local file inventory. Reports remain on the device." --target "${{ github.sha }}"
