name: Build Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --windowed --name WorkScout scout.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorkScout-Windows
          path: dist/WorkScout.exe
